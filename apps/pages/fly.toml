# fly.toml app configuration file generated for classmoji-pages
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'classmoji-pages'
primary_region = 'iad'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Without a check, a boot crash still reads as a green deploy (learned the
  # hard way: the image once shipped without server/ and crash-looped while
  # the deploy job passed). /health is answered before host classification,
  # so it works on any Host header.
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
