# fly.toml app configuration file generated for classmoji-site on 2026-01-07T14:34:30-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'classmoji-site'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Concurrency is counted per request. There is no hard_limit, Fly's default,
  # so the proxy never queues or refuses requests for this app. soft_limit only
  # steers traffic between machines (and starts a stopped one, when there is
  # one); with one machine it changes nothing.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 48

  # A machine gets traffic only once this answers 200 (a prebuilt page, served
  # in a few ms). With the bluegreen strategy below, a release boots a new
  # machine next to the old one, which keeps serving until the new one passes.
  # A rollback (`flyctl deploy --image <previous image>`) waits for the same
  # check; `--strategy immediate` replaces the machine without waiting.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/"

[deploy]
  strategy = "bluegreen"

[env]
  PORT = "8080"

[[vm]]
  memory = '256mb'
  cpus = 1
