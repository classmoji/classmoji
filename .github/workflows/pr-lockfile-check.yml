name: PR Lockfile Check

# Catches a specific failure mode: external contributors who clone without the
# private ai-agent submodule can accidentally strip ai-agent's deps from
# package-lock.json when they run `npm install`. When their PR merges to
# staging, CI's `npm ci` then fails. This workflow runs BEFORE merge, against
# a workspace tree that includes ai-agent's package.json, and fails the PR if
# the committed lockfile is out of sync with it.
#
# The submodule is never checked out. Only ai-agent's package.json is needed,
# and it comes from one of two places:
# - Pull requests from branches of this repository: the real package.json at
#   the ai-agent commit recorded at the PR head, read with a token that can
#   see the private ai-agent repository.
# - Pull requests from forks, which get no secrets: a package.json rebuilt
#   from the apps/ai-agent entry of the base branch's package-lock.json. A
#   fork can't move the private submodule, so its PR must record the same
#   ai-agent commit as the base branch.
#
# Under pull_request this workflow runs from the PR's own copy of it, so the
# check is advisory: in fork PRs, reviewers should look at any change to this
# file or to .npmrc.

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - '.github/workflows/pr-lockfile-check.yml'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'apps/ai-agent'

permissions: {}

concurrency:
  group: pr-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR head without submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          persist-credentials: false

      - name: Fetch ai-agent package.json (pull request from this repository)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          SUBMODULE_SHA=$(git ls-tree HEAD -- apps/ai-agent | awk '$1 == "160000" && $2 == "commit" { print $3 }')
          if ! [[ "$SUBMODULE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::apps/ai-agent is not a submodule at the PR head."
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PERSONAL_ACCESS_TOKEN is not available to this run."
            exit 1
          fi
          echo "ai-agent submodule commit: $SUBMODULE_SHA"
          mkdir -p apps/ai-agent
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/classmoji/ai-agent/contents/package.json?ref=${SUBMODULE_SHA}" > apps/ai-agent/package.json
          jq -e 'type == "object"' apps/ai-agent/package.json > /dev/null

      - name: Rebuild ai-agent package.json from the base branch (pull request from a fork)
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unexpected base branch name."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [ "$(git ls-tree HEAD -- apps/ai-agent)" != "$(git ls-tree "origin/${BASE_REF}" -- apps/ai-agent)" ]; then
            echo "::error::apps/ai-agent records a different ai-agent commit than ${BASE_REF}. Pull requests from forks can't change the private ai-agent submodule."
            echo "::error::If ${BASE_REF} has moved it since this branch was created, merge ${BASE_REF} into this branch and keep its apps/ai-agent commit."
            exit 1
          fi
          mkdir -p apps/ai-agent
          git show "origin/${BASE_REF}:package-lock.json" | jq -e '
            .packages["apps/ai-agent"] // error("no apps/ai-agent entry in the base lockfile")
            | del(.resolved, .link, .extraneous, .dev, .optional, .devOptional, .peer, .inBundle, .integrity)
          ' > apps/ai-agent/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The npm version matters: Node 24 bundles npm 11, which adds `libc`
      # fields to package-lock.json and would report every lockfile written by
      # npm 10 as out of sync. One npm everywhere: keep this in step with the
      # root package.json's `packageManager` and the npm the other workflows pin.
      - name: Pin npm
        run: |
          npm install -g npm@10.9.9
          npm --version

      - name: Regenerate lockfile against real workspace tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Fail if committed lockfile is out of sync
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo ""
            echo "::error::package-lock.json is out of sync with the workspace tree."
            echo "::error::This usually means the PR was generated without the ai-agent submodule populated."
            echo "::error::A maintainer needs to regenerate the lockfile with the submodule initialized before this PR can merge."
            exit 1
          fi
          echo "Lockfile is in sync."
