name: Deploy to Fly.io (Staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Detect which apps have changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp == 'true' || github.event_name == 'workflow_dispatch' }}
      hook-station: ${{ steps.filter.outputs.hook-station == 'true' || github.event_name == 'workflow_dispatch' }}
      collab: ${{ steps.filter.outputs.collab == 'true' || github.event_name == 'workflow_dispatch' }}
      mcp: ${{ steps.filter.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch' }}
      site: ${{ steps.filter.outputs.site == 'true' || github.event_name == 'workflow_dispatch' }}
      slides: ${{ steps.filter.outputs.slides == 'true' || github.event_name == 'workflow_dispatch' }}
      pages: ${{ steps.filter.outputs.pages == 'true' || github.event_name == 'workflow_dispatch' }}
      admin: ${{ steps.filter.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
      tasks: ${{ steps.filter.outputs.tasks == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            webapp:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/webapp/**'
              - 'packages/**'
            hook-station:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/hook-station/**'
              - 'packages/**'
            collab:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/collab/**'
              - 'packages/**'
            mcp:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/mcp/**'
              - 'packages/**'
            site:
              - 'apps/site/**'
            slides:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/slides/**'
              - 'packages/**'
            pages:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/pages/**'
              - 'packages/**'
            admin:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/deploy-fly-staging.yml'
              - '.github/workflows/build-fly-staging.yml'
              - 'apps/admin/**'
              - 'packages/**'
            tasks:
              - 'packages/tasks/**'
              # Holds the quiz and Ask Moji chat agents' tasks (a pointer bump
              # redeploys).
              - 'apps/ai-agent'
              - 'apps/ai-agent/**'
              - 'packages/database/**'
              - 'packages/services/**'
              - 'packages/utils/**'
              # The worker bundles services, which signs media and content
              # URLs with this package.
              - 'packages/content-signing/**'
              # content-checkpoint renders live docs with these.
              - 'packages/collab/**'
              - 'packages/page-schema/**'

  # Build images before the migration barrier; only rollouts wait for webapp.
  # At most six monorepo builds: collab takes hook-station's slot when it
  # finishes.
  build-webapp:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: webapp
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  build-hook-station:
    needs: changes
    if: needs.changes.outputs.hook-station == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: hook-station
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  build-collab:
    needs: [changes, build-hook-station]
    if: always() && !cancelled() && needs.changes.outputs.collab == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: collab
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  build-mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: mcp
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  build-pages:
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: pages
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  build-slides:
    needs: changes
    if: needs.changes.outputs.slides == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: slides
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  build-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/build-fly-staging.yml
    with:
      service: admin
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  deploy-webapp:
    needs: [changes, build-webapp]
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy webapp
        run: |
          CONFIG=$(scripts/fly-autostop-config.sh apps/webapp/fly.toml stop)
          flyctl deploy --config "$CONFIG" --image "$IMAGE" --app classmoji-webapp-staging
        env:
          IMAGE: ${{ needs.build-webapp.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Each rollout requires its image and the successful webapp migration barrier.
  deploy-hook-station:
    needs: [changes, deploy-webapp, build-hook-station]
    if: always() && !cancelled() && needs.build-hook-station.result == 'success' && needs.build-hook-station.outputs.image != '' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy hook-station
        run: |
          # hook-station is the one staging app that must NOT scale to zero: a
          # cold start takes ~20 s and GitHub gives a webhook delivery 10 s with
          # no retry, so every push/issue event that arrived while it slept was
          # lost. Deploy the production config as-is (auto_stop off, one machine
          # always running; shared-cpu-1x, pennies).
          flyctl deploy --config apps/hook-station/fly.toml --image "$IMAGE" --app classmoji-hook-station-staging
        env:
          IMAGE: ${{ needs.build-hook-station.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Trigger tasks deploy first: collab triggers task payloads (e.g. warm
  # runs) that the previous task version would not understand.
  deploy-collab:
    needs: [changes, deploy-webapp, build-collab, deploy-trigger]
    if: always() && !cancelled() && needs.build-collab.result == 'success' && needs.build-collab.outputs.image != '' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped')) && (needs.deploy-trigger.result == 'success' || needs.deploy-trigger.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy collab
        run: |
          # Like hook-station, collab must NOT scale to zero: open rooms and
          # their unsaved edits live in the one machine's memory. Deploy the
          # production config as-is (auto_stop off, exactly one machine).
          # `flyctl status` succeeds for an app that exists with zero machines,
          # so the first deploy after provisioning runs and creates the
          # machine; --ha=false makes that one machine, not Fly's default two.
          if flyctl status --app classmoji-collab-staging >/dev/null 2>&1; then
            flyctl deploy --config apps/collab/fly.toml --image "$IMAGE" --app classmoji-collab-staging --ha=false
          else
            echo "::notice::Skipping collab deploy because Fly app classmoji-collab-staging is not provisioned."
          fi
        env:
          IMAGE: ${{ needs.build-collab.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-mcp:
    needs: [changes, deploy-webapp, build-mcp]
    if: always() && !cancelled() && needs.build-mcp.result == 'success' && needs.build-mcp.outputs.image != '' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy mcp
        run: |
          if flyctl status --app classmoji-mcp-staging >/dev/null 2>&1; then
            CONFIG=$(scripts/fly-autostop-config.sh apps/mcp/fly.toml stop)
            flyctl deploy --config "$CONFIG" --image "$IMAGE" --app classmoji-mcp-staging
          else
            echo "::notice::Skipping mcp deploy because Fly app classmoji-mcp-staging is not provisioned."
          fi
        env:
          IMAGE: ${{ needs.build-mcp.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy site
        working-directory: apps/site
        run: |
          if flyctl status --app classmoji-site-staging >/dev/null 2>&1; then
            CONFIG=$(../../scripts/fly-autostop-config.sh fly.toml stop)
            flyctl deploy --config "$CONFIG" --remote-only --depot=true --depot-scope=app --app classmoji-site-staging
          else
            echo "::notice::Skipping site deploy because Fly app classmoji-site-staging is not provisioned."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-slides:
    needs: [changes, deploy-webapp, build-slides]
    if: always() && !cancelled() && needs.build-slides.result == 'success' && needs.build-slides.outputs.image != '' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy slides
        run: |
          CONFIG=$(scripts/fly-autostop-config.sh apps/slides/fly.toml stop)
          flyctl deploy --config "$CONFIG" --image "$IMAGE" --app classmoji-slides-staging
        env:
          IMAGE: ${{ needs.build-slides.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-pages:
    needs: [changes, deploy-webapp, build-pages]
    if: always() && !cancelled() && needs.build-pages.result == 'success' && needs.build-pages.outputs.image != '' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy pages
        run: |
          CONFIG=$(scripts/fly-autostop-config.sh apps/pages/fly.toml stop)
          flyctl deploy --config "$CONFIG" --image "$IMAGE" --app classmoji-pages-staging
        env:
          IMAGE: ${{ needs.build-pages.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-admin:
    needs: [changes, deploy-webapp, build-admin]
    if: always() && !cancelled() && needs.build-admin.result == 'success' && needs.build-admin.outputs.image != '' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy admin
        run: |
          CONFIG=$(scripts/fly-autostop-config.sh apps/admin/fly.toml stop)
          flyctl deploy --config "$CONFIG" --image "$IMAGE" --app classmoji-admin-staging
        env:
          IMAGE: ${{ needs.build-admin.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-trigger:
    needs: [changes, deploy-webapp]
    if: always() && !cancelled() && needs.changes.outputs.tasks == 'true' && (needs.deploy-webapp.result == 'success' || (needs.changes.outputs.webapp != 'true' && needs.deploy-webapp.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The CLI the deploy runs. Every installed @trigger.dev package must be
      # this version (checked below). Stricter than the CLI on purpose: the CLI
      # itself only compares the @trigger.dev packages that packages/tasks
      # declares.
      TRIGGER_CLI_VERSION: 4.8.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version

      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check a single @trigger.dev/sdk version is installed
        run: |
          versions=$(npm ls @trigger.dev/sdk --all --json --legacy-peer-deps 2>/dev/null | node -e 'const seen=new Set();const walk=n=>{for(const [k,v] of Object.entries((n&&n.dependencies)||{})){if(k==="@trigger.dev/sdk"&&v.version)seen.add(v.version);walk(v)}};walk(JSON.parse(require("fs").readFileSync(0,"utf8")));console.log([...seen].sort().join(" "))')
          echo "@trigger.dev/sdk versions: ${versions:-none}"
          if [ "$(echo $versions | wc -w)" -ne 1 ]; then
            echo "::error::Expected exactly one @trigger.dev/sdk version; apps/ai-agent and packages/tasks must pin the same one."
            exit 1
          fi

      - name: Check every installed @trigger.dev package is the CLI's version
        run: |
          npm ls --all --json --legacy-peer-deps 2>/dev/null | node -e '
            const want = process.env.TRIGGER_CLI_VERSION;
            const seen = new Set();
            const walk = n => {
              for (const [k, v] of Object.entries((n && n.dependencies) || {})) {
                if (k.startsWith("@trigger.dev/") && v.version) seen.add(k + "@" + v.version);
                walk(v);
              }
            };
            walk(JSON.parse(require("fs").readFileSync(0, "utf8")));
            const all = [...seen].sort();
            console.log("@trigger.dev packages: " + (all.join(" ") || "none"));
            const off = all.filter(p => p.slice(p.lastIndexOf("@") + 1) !== want);
            if (!want || all.length === 0 || off.length > 0) {
              console.log("::error::Every installed @trigger.dev package must be " + want + ", the CLI version this job deploys with; off: " + (off.join(" ") || "none found"));
              process.exit(1);
            }
          '

      - name: Deploy to Trigger.dev
        working-directory: packages/tasks
        run: npx trigger.dev@$TRIGGER_CLI_VERSION deploy --push -e staging
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: e9a6487c-350e-41e7-8bba-2d95ca5934a6
          INFISICAL_HOST: https://app.infisical.com
