name: Deploy to Cloudflare (Staging)

on:
  push:
    branches:
      - staging
    # The union of the jobs' filters below; each job runs only for its own.
    paths:
      - 'apps/content/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/deploy-cloudflare-staging.yml'
  workflow_dispatch:

# A constant group, not `github.ref`: a `workflow_dispatch` from a feature
# branch is a normal way to smoke-test staging, and it must queue behind a push
# to `staging` rather than race it over the same Worker script.
concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  # Which Workers to deploy. A manual run deploys both.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      content: ${{ steps.filter.outputs.content == 'true' || github.event_name == 'workflow_dispatch' }}
      admin: ${{ steps.filter.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            content:
              - 'apps/content/**'
              - 'packages/content-signing/**'
              - '.github/workflows/deploy-cloudflare-staging.yml'
            admin:
              - 'apps/admin/**'
              # The Worker bundles auth, database, services, utils, workers
              # (and what they import), so any shared package redeploys it,
              # as on Fly.
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/deploy-cloudflare-staging.yml'

  deploy-content-worker:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    # Read-only token: this job checks out code and talks to Cloudflare and
    # Infisical with their own credentials. It never writes back to the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version

      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck and test content-signing
        run: |
          if [ -d packages/content-signing ]; then
            npm run typecheck -w packages/content-signing
            npm run test -w packages/content-signing
          else
            echo "::notice::packages/content-signing is not in the tree yet; skipping its checks."
          fi

      - name: Typecheck and test content worker
        run: |
          npm run typecheck -w apps/content
          npm run test -w apps/content

      - name: Deploy content worker
        working-directory: apps/content
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # An exact version, the one the last green deploy used (0.44.9, prod run
      # 40053064558), so a deploy does not pick up whatever was published last.
      # Move it on deliberately.
      - name: Install Infisical CLI
        run: npm install -g @infisical/cli@0.44.9

      # Secrets are pushed AFTER the deploy, and that order is required:
      # `wrangler secret bulk` targets an existing Worker script, so on a
      # first-ever deploy there is nothing to attach them to until the script
      # exists. The cost is a short window — between the two steps — where a
      # freshly deployed version is still reading the PREVIOUS values. That is
      # invisible for an unchanged secret, and harmless for a signing-key
      # rotation too, because the Worker keeps verifying against
      # CONTENT_SIGNING_SECRET_PREVIOUS: for those few seconds it simply has
      # not been told about the new key yet, and every URL in flight was minted
      # under one it still accepts.
      #
      # `--env=sta` is the Infisical slug for staging. It is not a typo for
      # Trigger.dev's `stg`, which belongs to a different system entirely.
      #
      # The Worker answers 503 for every content request until both secrets are
      # present, so this step verifies the export before pushing it and fails
      # the job loudly if the shape is wrong. Secret values are never printed.
      - name: Sync secrets from Infisical
        working-directory: apps/content
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: e9a6487c-350e-41e7-8bba-2d95ca5934a6
          INFISICAL_HOST: https://app.infisical.com
          INFISICAL_DISABLE_UPDATE_CHECK: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          RAW_SECRETS="$(mktemp)"
          BULK_SECRETS="$(mktemp)"
          trap 'rm -f "$RAW_SECRETS" "$BULK_SECRETS"' EXIT

          INFISICAL_TOKEN="$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent --plain)"
          export INFISICAL_TOKEN

          # stdout is the payload and never printed; stderr carries only the
          # CLI's own messages, so it is safe to show and is the one place a
          # silent-but-successful export explains itself.
          EXPORT_STDERR="$(mktemp)"
          infisical export \
            --env=sta \
            --path=/content-worker \
            --projectId="$INFISICAL_PROJECT_ID" \
            --format=json --silent > "$RAW_SECRETS" 2> "$EXPORT_STDERR" || {
              echo "::error::infisical export failed:"; cat "$EXPORT_STDERR"; exit 1; }
          [ -s "$EXPORT_STDERR" ] && { echo "infisical export stderr:"; cat "$EXPORT_STDERR"; }
          rm -f "$EXPORT_STDERR"

          infisical --version

          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            // `node -e` puts the first extra argument at argv[1], not argv[2].
            const [raw, out] = process.argv.slice(1);
            const required = ["CONTENT_SIGNING_SECRET", "CONTENT_WORKER_SHARED_SECRET"];
            // Present only while a signing key is being rotated: the Worker
            // verifies against it as a fallback so URLs minted under the old
            // key survive the change. Allowed, never required.
            const optional = ["CONTENT_SIGNING_SECRET_PREVIOUS"];
            const allowed = [...required, ...optional];

            const text = readFileSync(raw, "utf8");
            // Tolerate anything the CLI prints ahead of the payload: parse from
            // the first JSON opener onwards.
            const start = Math.min(...["[", "{"].map(c => text.indexOf(c)).filter(i => i >= 0));
            let parsed;
            try {
              if (!Number.isFinite(start)) throw new Error("no JSON opener");
              parsed = JSON.parse(text.slice(start));
            } catch (error) {
              // Diagnose without disclosing: length, shape, and the first line
              // with any token long enough to be a value masked.
              const head = text.split("\n")[0].slice(0, 80).replace(/\S{12,}/g, "<redacted>");
              console.error(`::error::Infisical export was not valid JSON (${text.length} bytes, ${error.message}). First line: ${JSON.stringify(head)}`);
              process.exit(1);
            }

            // The CLI emits [{ key, value }, ...]; tolerate a plain { KEY: value } map too.
            const secrets = Array.isArray(parsed)
              ? Object.fromEntries(parsed.map(entry => [entry.key, entry.value]))
              : parsed;

            const found = Object.keys(secrets).sort();
            const valueOf = key => (typeof secrets[key] === "string" ? secrets[key] : "");
            // Whitespace-only is blank. A slot cleared with a space or a stray
            // newline must not be pushed: the Worker would then hold " " as a
            // master key, which is a signing key anybody can guess.
            const isSet = key => valueOf(key).trim().length > 0;

            // A reference Infisical failed to expand is still a plain string,
            // so it passes every other check here and the Worker boots
            // reporting configured:true while 403ing every URL.
            const UNEXPANDED = /\$\{/;
            // Signing keys are openssl rand -hex 32, i.e. 64 characters. 32 is
            // a floor meant to catch a placeholder, not a spec.
            const MIN_SIGNING_LENGTH = 32;
            const signingKeys = ["CONTENT_SIGNING_SECRET", "CONTENT_SIGNING_SECRET_PREVIOUS"];

            const missing = required.filter(key => !isSet(key));
            const unexpected = found.filter(key => !allowed.includes(key));
            const unexpanded = allowed.filter(key => isSet(key) && UNEXPANDED.test(valueOf(key)));
            const tooShort = signingKeys.filter(
              key => isSet(key) && valueOf(key).trim().length < MIN_SIGNING_LENGTH
            );

            // Names and counts only — never a value, not even a fragment.
            const problems = [];
            if (missing.length) {
              problems.push(`is missing or blank: ${missing.join(", ")}. The Worker would serve 503 for every request.`);
            }
            if (unexpected.length) {
              problems.push(`has unexpected keys: ${unexpected.join(", ")}.`);
            }
            if (unexpanded.length) {
              problems.push(`has unexpanded references: ${unexpanded.join(", ")}. A literal reference verifies nothing: every URL would 403 while /healthz still said configured:true.`);
            }
            if (tooShort.length) {
              problems.push(`has signing keys under ${MIN_SIGNING_LENGTH} characters: ${tooShort.join(", ")}. These are openssl rand -hex 32.`);
            }

            if (problems.length) {
              for (const problem of problems) {
                console.error(`::error::Infisical /content-worker (sta) ${problem}`);
              }
              process.exit(1);
            }

            // Only keys that are actually set are pushed, and their values go
            // through untouched — trimming here would desync the Worker from
            // the Fly apps, which read the same secret raw. Note the asymmetry:
            // removing the previous key from Infisical does not remove it from
            // the Worker, because `secret bulk` never deletes. Finishing a
            // rotation takes an explicit `wrangler secret delete`.
            const pushing = allowed.filter(isSet);
            writeFileSync(out, JSON.stringify(Object.fromEntries(pushing.map(key => [key, secrets[key]]))));
            console.log(`Verified ${pushing.length} secrets from Infisical (${pushing.join(", ")}).`);
          ' "$RAW_SECRETS" "$BULK_SECRETS"

          npx wrangler secret bulk "$BULK_SECRETS" --env staging

  # apps/admin as a Worker on admin.staging.classmoji.io (BUILD_TARGET=cloudflare).
  # Fly's classmoji-admin-staging keeps deploying from deploy-fly-staging.yml
  # until this Worker is verified; the job is then removed from there.
  deploy-admin-worker:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only token, as for the content worker.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # See deploy-content-worker.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version

      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Both clients: the Node one (tests) and the Workers one, which
      # @classmoji/workers/vite swaps in for @prisma/client.
      - name: Generate Prisma clients
        run: ./node_modules/.bin/prisma generate --schema packages/database/schema.prisma

      - name: Test the Workers glue and admin
        run: |
          npm run test -w packages/workers
          npm run test -w packages/database
          npm run test -w apps/admin

      # The environment is chosen at BUILD time: the Cloudflare Vite plugin
      # flattens env.staging into build/server/wrangler.json, and every
      # wrangler call below reads that file.
      - name: Build the admin Worker
        working-directory: apps/admin
        env:
          BUILD_TARGET: cloudflare
          CLOUDFLARE_ENV: staging
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx react-router build
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("build/server/wrangler.json", "utf8"));
            const fail = message => { console.error(`::error::${message}`); process.exit(1); };
            if (config.name !== "classmoji-admin-staging") fail(`built for ${config.name}, not classmoji-admin-staging`);
            const hyperdrive = (config.hyperdrive ?? []).find(h => h.binding === "HYPERDRIVE");
            if (!hyperdrive || !/^[0-9a-f]{32}$/.test(hyperdrive.id ?? "")) {
              fail("env.staging in apps/admin/wrangler.jsonc has no real Hyperdrive id (still the placeholder?)");
            }
            console.log(`Built ${config.name}: ${Object.keys(config.vars ?? {}).length} vars, Hyperdrive bound.`);
          '

      - name: Deploy admin Worker
        working-directory: apps/admin
        run: npx wrangler deploy -c build/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # See deploy-content-worker for the version pin.
      - name: Install Infisical CLI
        run: npm install -g @infisical/cli@0.44.9

      # After the deploy, for the reason given in deploy-content-worker
      # (`secret bulk` needs the script to exist). Admin reads the shared root
      # of Infisical `sta`, which holds every service's secrets, so only an
      # ALLOWLIST is pushed: the env reads reachable from the admin bundle
      # (plans/2026-11-09-admin-on-workers/plan.md, section E). Keys outside
      # it are ignored, not errors. Required keys must be present and
      # non-blank; optional ones are pushed only when set. Names only in logs.
      - name: Sync secrets from Infisical
        working-directory: apps/admin
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: e9a6487c-350e-41e7-8bba-2d95ca5934a6
          INFISICAL_HOST: https://app.infisical.com
          INFISICAL_DISABLE_UPDATE_CHECK: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          RAW_SECRETS="$(mktemp)"
          BULK_SECRETS="$(mktemp)"
          trap 'rm -f "$RAW_SECRETS" "$BULK_SECRETS"' EXIT

          INFISICAL_TOKEN="$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent --plain)"
          export INFISICAL_TOKEN

          EXPORT_STDERR="$(mktemp)"
          infisical export \
            --env=sta \
            --path=/ \
            --projectId="$INFISICAL_PROJECT_ID" \
            --format=json --silent > "$RAW_SECRETS" 2> "$EXPORT_STDERR" || {
              echo "::error::infisical export failed:"; cat "$EXPORT_STDERR"; exit 1; }
          [ -s "$EXPORT_STDERR" ] && { echo "infisical export stderr:"; cat "$EXPORT_STDERR"; }
          rm -f "$EXPORT_STDERR"

          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const [raw, out, configPath] = process.argv.slice(1);
            // Read at module load in production; the Worker answers 500 for
            // every request without them (checked under wrangler dev).
            // PLATFORM_ADMIN_USER_IDS empty means nobody gets in.
            const required = ["BETTER_AUTH_SECRET", "MCP_PUBLIC_URL", "PLATFORM_ADMIN_USER_IDS"];
            // Read by code admin reaches; each feature degrades without its key.
            const optional = [
              "GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET",
              "GITLAB_CLIENT_ID", "GITLAB_CLIENT_SECRET", "GITLAB_URL", "GITLAB_ISSUER",
              "GITLAB_WEBHOOK_URL", "GITLAB_WEBHOOK_SECRET",
              "CONTENT_SIGNING_SECRET", "CONTENT_DELIVERY_ORIGIN",
              "CLASSMOJI_EGRESS_IPS",
              // Gitlab approval emails are queued as a Trigger.dev task.
              "TRIGGER_SECRET_KEY",
            ];
            const allowed = [...required, ...optional];

            const text = readFileSync(raw, "utf8");
            const start = Math.min(...["[", "{"].map(c => text.indexOf(c)).filter(i => i >= 0));
            let parsed;
            try {
              if (!Number.isFinite(start)) throw new Error("no JSON opener");
              parsed = JSON.parse(text.slice(start));
            } catch (error) {
              const head = text.split("\n")[0].slice(0, 80).replace(/\S{12,}/g, "<redacted>");
              console.error(`::error::Infisical export was not valid JSON (${text.length} bytes, ${error.message}). First line: ${JSON.stringify(head)}`);
              process.exit(1);
            }
            const secrets = Array.isArray(parsed)
              ? Object.fromEntries(parsed.map(entry => [entry.key, entry.value]))
              : parsed;
            const valueOf = key => (typeof secrets[key] === "string" ? secrets[key] : "");
            const isSet = key => valueOf(key).trim().length > 0;
            const UNEXPANDED = /\$\{/;

            // A secret and a var of the same name collide on deploy.
            const vars = Object.keys(JSON.parse(readFileSync(configPath, "utf8")).vars ?? {});
            const clashing = allowed.filter(key => vars.includes(key));
            const missing = required.filter(key => !isSet(key));
            const unexpanded = allowed.filter(key => isSet(key) && UNEXPANDED.test(valueOf(key)));

            const problems = [];
            if (clashing.length) problems.push(`allowlist names also set as wrangler vars: ${clashing.join(", ")}.`);
            if (missing.length) problems.push(`is missing or blank: ${missing.join(", ")}. The Worker would fail every request.`);
            if (unexpanded.length) problems.push(`has unexpanded references: ${unexpanded.join(", ")}.`);
            if (problems.length) {
              for (const problem of problems) console.error(`::error::Infisical / (sta) ${problem}`);
              process.exit(1);
            }

            // Values go through untouched, as for the content worker; `secret
            // bulk` never deletes, so a key cleared in Infisical stays on the
            // Worker until `wrangler secret delete`.
            const pushing = allowed.filter(isSet);
            writeFileSync(out, JSON.stringify(Object.fromEntries(pushing.map(key => [key, secrets[key]]))));
            const skipped = optional.filter(key => !isSet(key));
            console.log(`Verified ${pushing.length} secrets from Infisical (${pushing.join(", ")}).`);
            if (skipped.length) console.log(`Not set in Infisical, not pushed: ${skipped.join(", ")}.`);
          ' "$RAW_SECRETS" "$BULK_SECRETS" build/server/wrangler.json

          npx wrangler secret bulk "$BULK_SECRETS" -c build/server/wrangler.json
