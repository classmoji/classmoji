name: Build staging Fly image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
    secrets:
      FLY_API_TOKEN:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: true
      # Source map upload for the webapp, pages and slides; optional.
      SENTRY_AUTH_TOKEN:
        required: false
    outputs:
      image:
        description: Image pushed for this staging service and workflow attempt
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: ./.github/actions/setup-flyctl
        timeout-minutes: 15
      - name: Build and push staging image
        id: build
        env:
          SERVICE: ${{ inputs.service }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          case "$SERVICE" in
            webapp|hook-station|collab|mcp|pages|slides|admin) ;;
            *) echo "Unsupported staging service: $SERVICE" >&2; exit 1 ;;
          esac
          APP="classmoji-${SERVICE}-staging"
          if { [ "$SERVICE" = mcp ] || [ "$SERVICE" = collab ]; } && ! flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "::notice::Skipping $SERVICE build because its staging app is not provisioned."
            exit 0
          fi
          DOCKERFILE="apps/${SERVICE}/Dockerfile"
          # Browser apps upload source maps to Sentry when the secret exists;
          # without it the image builds exactly as before.
          set --
          case "$SERVICE" in
            webapp|pages|slides)
              if [ -n "$SENTRY_AUTH_TOKEN" ]; then
                set -- --build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
              fi
              ;;
          esac
          # The staging host for allowedActionOrigins (apps/*/actionOrigins.js);
          # without it the image would carry the production host.
          case "$SERVICE" in
            webapp) set -- "$@" --build-arg "ACTION_ORIGIN_HOSTS=staging.classmoji.io" ;;
            slides) set -- "$@" --build-arg "ACTION_ORIGIN_HOSTS=slides.staging.classmoji.io" ;;
          esac
          LABEL="staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          flyctl deploy --config "apps/${SERVICE}/fly.toml" --dockerfile "$DOCKERFILE" \
            --app "$APP" --remote-only --depot=true --depot-scope=app \
            --build-only --push --image-label "$LABEL" "$@"
          echo "image=registry.fly.io/${APP}:${LABEL}" >> "$GITHUB_OUTPUT"
