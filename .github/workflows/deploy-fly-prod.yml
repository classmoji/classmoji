name: Deploy to Fly.io (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect which apps have changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp == 'true' || github.event_name == 'workflow_dispatch' }}
      hook-station: ${{ steps.filter.outputs.hook-station == 'true' || github.event_name == 'workflow_dispatch' }}
      collab: ${{ steps.filter.outputs.collab == 'true' || github.event_name == 'workflow_dispatch' }}
      mcp: ${{ steps.filter.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch' }}
      site: ${{ steps.filter.outputs.site == 'true' || github.event_name == 'workflow_dispatch' }}
      slides: ${{ steps.filter.outputs.slides == 'true' || github.event_name == 'workflow_dispatch' }}
      pages: ${{ steps.filter.outputs.pages == 'true' || github.event_name == 'workflow_dispatch' }}
      admin: ${{ steps.filter.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
      tasks: ${{ steps.filter.outputs.tasks == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            webapp:
              - 'apps/webapp/**'
              - 'packages/**'
            hook-station:
              - 'apps/hook-station/**'
              - 'packages/**'
            collab:
              - 'apps/collab/**'
              - 'packages/**'
            mcp:
              - 'apps/mcp/**'
              - 'packages/**'
            site:
              - 'apps/site/**'
            slides:
              - 'apps/slides/**'
              - 'packages/**'
            pages:
              - 'apps/pages/**'
              - 'packages/**'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
            tasks:
              - 'packages/tasks/**'
              # Holds the quiz and Ask Moji chat agents' tasks (a pointer bump
              # redeploys).
              - 'apps/ai-agent'
              - 'apps/ai-agent/**'
              - 'packages/database/**'
              - 'packages/services/**'
              - 'packages/utils/**'
              # The worker bundles services, which signs media and content
              # URLs with this package.
              - 'packages/content-signing/**'
              # content-checkpoint renders live docs with these.
              - 'packages/collab/**'
              - 'packages/page-schema/**'

  deploy-webapp:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy webapp
        run: |
          # Source maps go to Sentry only when the secret exists; without it
          # the image builds exactly as before.
          set --
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            set -- --build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          fi
          flyctl deploy --config apps/webapp/fly.toml --dockerfile apps/webapp/Dockerfile --remote-only \
            --build-arg "ACTION_ORIGIN_HOSTS=app.classmoji.io" "$@"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-hook-station:
    needs: [changes, deploy-webapp]
    # Wait on deploy-webapp so its Prisma release_command applies any pending
    # migration before non-webapp services come up with new code.
    if: always() && needs.changes.outputs.hook-station == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy hook-station
        run: flyctl deploy --config apps/hook-station/fly.toml --dockerfile apps/hook-station/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Trigger tasks deploy first: collab triggers task payloads (e.g. warm
  # runs) that the previous task version would not understand.
  deploy-collab:
    needs: [changes, deploy-webapp, deploy-trigger]
    if: always() && needs.changes.outputs.collab == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped') && (needs.deploy-trigger.result == 'success' || needs.deploy-trigger.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy collab
        run: |
          # Single instance (apps/collab/fly.toml): --ha=false makes the first
          # deploy of a machine-less app create one machine, not two.
          if flyctl status --app classmoji-collab >/dev/null 2>&1; then
            flyctl deploy --config apps/collab/fly.toml --dockerfile apps/collab/Dockerfile --remote-only --ha=false
          else
            echo "::notice::Skipping collab deploy because Fly app classmoji-collab is not provisioned."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-mcp:
    needs: [changes, deploy-webapp]
    if: always() && needs.changes.outputs.mcp == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy mcp
        run: |
          if flyctl status --app classmoji-mcp >/dev/null 2>&1; then
            flyctl deploy --config apps/mcp/fly.toml --dockerfile apps/mcp/Dockerfile --remote-only
          else
            echo "::notice::Skipping mcp deploy because Fly app classmoji-mcp is not provisioned."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy site
        working-directory: apps/site
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-slides:
    needs: [changes, deploy-webapp]
    if: always() && needs.changes.outputs.slides == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy slides
        run: |
          # Source maps go to Sentry only when the secret exists; without it
          # the image builds exactly as before.
          set --
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            set -- --build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          fi
          flyctl deploy --config apps/slides/fly.toml --dockerfile apps/slides/Dockerfile --remote-only \
            --build-arg "ACTION_ORIGIN_HOSTS=slides.classmoji.io" "$@"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-pages:
    needs: [changes, deploy-webapp]
    if: always() && needs.changes.outputs.pages == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy pages
        run: |
          # Source maps go to Sentry only when the secret exists; without it
          # the image builds exactly as before.
          set --
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            set -- --build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          fi
          flyctl deploy --config apps/pages/fly.toml --dockerfile apps/pages/Dockerfile --remote-only "$@"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-admin:
    needs: [changes, deploy-webapp]
    if: always() && needs.changes.outputs.admin == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version
      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.5.1
      - name: Deploy admin
        run: flyctl deploy --config apps/admin/fly.toml --dockerfile apps/admin/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-trigger:
    needs: [changes, deploy-webapp]
    if: always() && needs.changes.outputs.tasks == 'true' && (needs.deploy-webapp.result == 'success' || needs.deploy-webapp.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # The CLI the deploy runs. It aborts a CI deploy when an installed
      # @trigger.dev package is on another version (checked below first).
      TRIGGER_CLI_VERSION: 4.8.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # the ai-agent submodule holds the chat agents' Trigger tasks
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # One npm everywhere, the packageManager one (10.9.9). Node 24 bundles
      # npm 11, which writes `libc` fields into lockfile entries it re-resolves
      # and warns about dependency install scripts.
      - name: Use npm 10.9
        run: npm install -g npm@10.9.9 && npm --version

      - name: Heal package-lock.json against submodule workspaces
        run: npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check a single @trigger.dev/sdk version is installed
        run: |
          versions=$(npm ls @trigger.dev/sdk --all --json --legacy-peer-deps 2>/dev/null | node -e 'const seen=new Set();const walk=n=>{for(const [k,v] of Object.entries((n&&n.dependencies)||{})){if(k==="@trigger.dev/sdk"&&v.version)seen.add(v.version);walk(v)}};walk(JSON.parse(require("fs").readFileSync(0,"utf8")));console.log([...seen].sort().join(" "))')
          echo "@trigger.dev/sdk versions: ${versions:-none}"
          if [ "$(echo $versions | wc -w)" -ne 1 ]; then
            echo "::error::Expected exactly one @trigger.dev/sdk version; apps/ai-agent and packages/tasks must pin the same one."
            exit 1
          fi

      - name: Check every installed @trigger.dev package is the CLI's version
        run: |
          npm ls --all --json --legacy-peer-deps 2>/dev/null | node -e '
            const want = process.env.TRIGGER_CLI_VERSION;
            const seen = new Set();
            const walk = n => {
              for (const [k, v] of Object.entries((n && n.dependencies) || {})) {
                if (k.startsWith("@trigger.dev/") && v.version) seen.add(k + "@" + v.version);
                walk(v);
              }
            };
            walk(JSON.parse(require("fs").readFileSync(0, "utf8")));
            const all = [...seen].sort();
            console.log("@trigger.dev packages: " + (all.join(" ") || "none"));
            const off = all.filter(p => p.slice(p.lastIndexOf("@") + 1) !== want);
            if (!want || all.length === 0 || off.length > 0) {
              console.log("::error::Every installed @trigger.dev package must be " + want + ", the CLI version this job deploys with; off: " + (off.join(" ") || "none found"));
              process.exit(1);
            }
          '

      - name: Deploy to Trigger.dev
        working-directory: packages/tasks
        run: npx trigger.dev@$TRIGGER_CLI_VERSION deploy --push
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: e9a6487c-350e-41e7-8bba-2d95ca5934a6
          INFISICAL_HOST: https://app.infisical.com
